name: Template Sync

# On-demand check for template drift. Deliberately NOT part of the ci.yml gate
# chain and NOT scheduled: it never blocks a PR merge and never runs on its own.
# Trigger it manually (Actions tab -> "Template Sync" -> "Run workflow") or call
# it from another workflow. It answers one question — "is this project behind the
# template it was generated from?" — using the .cruft.json written at generation.
#
# Behaviour:
#   - No .cruft.json (project predates cruft) -> green, with a notice to retrofit
#     via the link-to-template skill. Never a hard fail.
#   - .cruft.json present, up to date          -> green.
#   - .cruft.json present, behind the template  -> fail loudly, pointing at the
#     update-from-template skill.

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  template-sync:
    name: Template Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          python-version: "{{ cookiecutter.python_version }}"
          enable-cache: true

      - name: Check template sync
        run: |
          if [ ! -f .cruft.json ]; then
            echo "::notice::No .cruft.json — this project predates cruft. Run the 'link-to-template' skill to retrofit it, then 'update-from-template'."
            exit 0
          fi
          if uvx cruft check; then
            echo "Project is up to date with the template."
          else
            echo "::error::Project is behind the template. Run the 'update-from-template' skill (uvx cruft update) to catch up — see .claude/skills/update-from-template/."
            exit 1
          fi
