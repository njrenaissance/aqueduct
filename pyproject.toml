[project]
name = "aqueduct"
version = "0.1.0"
description = "Enumerate, download, and validate a OneDrive/SharePoint discovery share, with a defensible dated record."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "playwright>=1.62.0",
]

[project.scripts]
# Console entry points — installed by `uv sync`, runnable from the repo root
# (they read/write data in the current working directory).
login = "aqueduct.login:main"
webenum = "aqueduct.webenum:main"
filecopy = "aqueduct.filecopy:main"
validate = "aqueduct.validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aqueduct"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.9.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
markers = ["unit: unit tests", "integration: integration tests"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["basic/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "ARG", "SIM", "ERA", "PLR", "C901"]

[tool.ruff.lint.mccabe]
# Slightly above the template's 10: the network/reconcile loops are linear but
# branchy by nature, and splitting them would hurt readability more than help.
max-complexity = 12

[tool.ruff.lint.pylint]
# A couple of functions legitimately thread client/semaphore/paths/counters.
max-args = 9
max-positional-args = 9
max-branches = 15

[tool.ruff.lint.per-file-ignores]
# Tests lean on literal expected values and unused fixture args.
"tests/*" = ["PLR2004", "ARG001", "ARG002"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
# The template sets disallow_untyped_defs = true for greenfield code. This toolset
# predates the package refactor and is not yet fully annotated; keep the real type
# checks on and treat full annotation coverage as a follow-up (then flip this true).
disallow_untyped_defs = false
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
