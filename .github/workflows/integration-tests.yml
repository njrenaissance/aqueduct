name: Integration Tests

# Universal reusable workflow: ships in every scaffold.
# Behaviour:
#   - No integration tests present          -> green, services are NOT started.
#   - Integration tests present, no compose  -> hard fail (loudly), no silent skip.
#   - Integration tests present, compose ok  -> services up, tests run, services down.
# The job can never go green without having actually run the integration tests
# that exist.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Detect integration tests
        id: detect
        run: |
          set +e
          uv run pytest -m integration --collect-only -q >/dev/null 2>&1
          code=$?
          set -e
          # pytest exit code 5 == no tests collected: a legitimate "nothing to run".
          # A collection ERROR is exit 2, which we treat as have_tests=true so the
          # real run below surfaces the failure loudly.
          if [ "$code" -eq 5 ]; then
            echo "have_tests=false" >> "$GITHUB_OUTPUT"
            echo "No integration tests found — nothing to run."
          else
            echo "have_tests=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require compose when integration tests exist
        if: steps.detect.outputs.have_tests == 'true'
        run: |
          if [ ! -f docker-compose.yml ] && [ ! -f compose.yaml ]; then
            echo "::error::Integration tests exist but no docker-compose file is present to stand up their services."
            exit 1
          fi

      - name: Start services
        if: steps.detect.outputs.have_tests == 'true'
        run: docker compose up -d --wait

      - name: Run integration tests
        if: steps.detect.outputs.have_tests == 'true'
        run: uv run pytest -m integration -v

      - name: Stop services
        if: always() && steps.detect.outputs.have_tests == 'true'
        run: docker compose down -v
